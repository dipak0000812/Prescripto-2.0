name: CI

on:
  push:
  pull_request:

jobs:
  # ── Job 1: SQLite (no external services needed) ─────────────────────────
  sqlite:
    name: Test (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend with dev extras
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run pytest (SQLite)
        working-directory: backend
        run: python -m pytest -q

      - name: Run pyflakes
        working-directory: backend
        run: python -m pyflakes prescripto scripts tests

  # ── Job 2: PostgreSQL (real Postgres service) ────────────────────────────
  postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        # Wait until Postgres is ready before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend with dev extras
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run pytest (PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5433/postgres
        run: python -m pytest -q

      - name: Run pyflakes
        working-directory: backend
        run: python -m pyflakes prescripto scripts tests
