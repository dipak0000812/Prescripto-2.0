# GitHub Actions CI/CD Pipeline for Prescripto AI 2.0
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # Backend Tests
  # =========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prescripto_db
          POSTGRES_USER: prescripto
          POSTGRES_PASSWORD: prescripto_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prescripto -d prescripto_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev curl build-essential

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Generate JWT keys
        working-directory: ./backend
        run: |
          python scripts/generate_keys.py

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://prescripto:prescripto_secret@localhost:5432/prescripto_db
        run: |
          alembic upgrade head

      - name: Seed medications
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://prescripto:prescripto_secret@localhost:5432/prescripto_db
        run: |
          python scripts/seed_medications.py

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://prescripto:prescripto_secret@localhost:5432/prescripto_db
          S3_ENDPOINT: http://localhost:9000
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest --cov=prescripto --cov-report=xml --cov-report=term-missing -x \
            --ignore=tests/integration/test_distributed_ml_pipeline.py \
            --ignore=tests/integration/test_worker_engine.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # =========================================================================
  # Frontend Tests & Build
  # =========================================================================
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: ./web
        run: npm test -- --run --coverage

      - name: Build frontend
        working-directory: ./web
        env:
          VITE_API_BASE_URL: https://prescripto-2-0.onrender.com/api/v1
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 1

  # =========================================================================
  # Lint & Type Check
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend linting tools
        working-directory: ./backend
        run: |
          pip install ruff mypy

      - name: Run Ruff
        working-directory: ./backend
        run: ruff check prescripto/ tests/

      - name: Run MyPy
        working-directory: ./backend
        run: mypy --strict prescripto/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Run ESLint
        working-directory: ./web
        run: npx eslint src/ --ext .ts,.tsx || true

  # =========================================================================
  # Docker Build & Push (Main branch only)
  # =========================================================================
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, lint]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy to Render (Main branch only, after docker build)
  # =========================================================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment: production

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully"