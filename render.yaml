services:
  # ============================================================================
  # 1. FastAPI Backend API
  # ============================================================================
  - type: web
    name: prescripto-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python scripts/seed_medications.py && python scripts/create_user.py
    startCommand: uvicorn prescripto.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prescripto-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RECOGNITION_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # ============================================================================
  # 2. Asynchronous Queue Worker
  # ============================================================================
  - type: worker
    name: prescripto-worker
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m prescripto.worker.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prescripto-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: RECOGNITION_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false

  # ============================================================================
  # 3. React Vite Frontend (Static Site SPA)
  # ============================================================================
  - type: web
    name: prescripto-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: prescripto-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: prescripto-db
    databaseName: prescripto_db
    user: prescripto
    plan: free
    region: oregon

