[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prescripto"
version = "0.1.0"
description = "Prescription Document Intelligence & Medication-Safety Decision Support"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Prescripto AI Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-boto3>=1.34.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prescripto*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict = true

[[tool.mypy.overrides]]
module = "prescripto.domain.*"
strict = true
