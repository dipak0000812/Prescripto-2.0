[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "prescripto-ml-service"
version = "0.1.0"
description = "Prescripto independent ML inference service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pillow>=10.4.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=2.6.1",
    "paddleocr>=2.8.1",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "starlette",    # pulled by fastapi; explicit for testclient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
