      <text x="16" y="46" font-size="11" fill="#9CA3AF">Strict type checking &#183; Zero runtime errors</text>
      <text x="16" y="64" font-size="11" fill="#E2E8F0">React Router v7 (Patient vs Staff Shells)</text>
