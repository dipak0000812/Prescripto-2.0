# Production Docker Compose for Render + PostgreSQL
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: prescripto-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prescripto_db}
      POSTGRES_USER: ${POSTGRES_USER:-prescripto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prescripto} -d ${POSTGRES_DB:-prescripto_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: prescripto-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    container_name: prescripto-createbuckets-prod
    depends_on:
      - minio
    env_file:
      - ./backend/.env.prod
    volumes:
      - ./backend/scripts/init_buckets.py:/app/scripts/init_buckets.py:ro
    environment:
      - PYTHONPATH=/app
      - S3_ENDPOINT=http://minio:9000
    command: python scripts/init_buckets.py

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    container_name: prescripto-migrate-prod
    command: alembic upgrade head
    env_file:
      - ./backend/.env.prod
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-prescripto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prescripto_db}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    container_name: prescripto-api-prod
    restart: unless-stopped
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker prescripto.api.main:app --bind 0.0.0.0:8000 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
    env_file:
      - ./backend/.env.prod
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-prescripto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prescripto_db}
      - S3_ENDPOINT=http://minio:9000
      - GEMINI_MODEL=gemini-3.5-flash
      - GEMINI_FALLBACK_MODEL=gemini-3.1-flash-lite
      - RECOGNITION_PROVIDER=gemini
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    container_name: prescripto-worker-prod
    restart: unless-stopped
    command: python -m prescripto.worker.main
    env_file:
      - ./backend/.env.prod
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-prescripto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prescripto_db}
      - S3_ENDPOINT=http://minio:9000
      - GEMINI_MODEL=gemini-3.5-flash
      - GEMINI_FALLBACK_MODEL=gemini-3.1-flash-lite
      - RECOGNITION_PROVIDER=gemini
      - ML_RUNTIME_MODE=rapidocr
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  deletion_worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.prod
    container_name: prescripto-deletion-worker-prod
    restart: unless-stopped
    command: python -m prescripto.retention.worker
    env_file:
      - ./backend/.env.prod
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-prescripto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prescripto_db}
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    container_name: prescripto-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - ./web/.env.prod
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data: